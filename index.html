<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Uploader · download hub</title>
    <!-- Font Awesome 6 (free) for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #e6ecf5 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1.5rem 1rem 3rem;
        }

        .app-container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 45px -12px rgba(0, 20, 40, 0.35),
                        0 2px 10px 0 rgba(0, 0, 0, 0.05),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.8);
            padding: 2rem 2rem 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .header-icon {
            background: #1e2b3c;
            color: white;
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 8px 18px -6px rgba(0, 20, 40, 0.3);
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0e1e2f;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header h1 span {
            font-weight: 300;
            color: #4a5f7a;
            font-size: 1.2rem;
            margin-left: 0.5rem;
        }

        /* upload zone */
        .upload-section {
            background: #ffffffcc;
            border-radius: 2rem;
            padding: 1.75rem 2rem;
            margin-bottom: 2.5rem;
            border: 1px solid #ffffff;
            box-shadow: 0 8px 25px -12px rgba(0, 0, 0, 0.2);
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            color: #1a2c42;
            margin-bottom: 1.2rem;
            font-size: 1.2rem;
        }

        .section-label i {
            color: #1e2b3c;
            background: #d9e2ef;
            padding: 0.4rem;
            border-radius: 0.7rem;
            font-size: 1rem;
            width: 2rem;
            text-align: center;
        }

        .drop-area {
            border: 2px dashed #9bb1ca;
            border-radius: 1.5rem;
            padding: 2rem 1.5rem;
            text-align: center;
            background: #f8fcff;
            transition: all 0.2s ease;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .drop-area:hover {
            border-color: #1e2b3c;
            background: #eef4fe;
        }

        .drop-area i {
            font-size: 3rem;
            color: #3c5a7d;
            margin-bottom: 0.75rem;
            opacity: 0.9;
        }

        .drop-area p {
            font-size: 1.2rem;
            font-weight: 500;
            color: #1e2b3c;
        }

        .drop-area small {
            display: block;
            margin-top: 0.35rem;
            color: #5b6f87;
            font-size: 0.9rem;
        }

        .file-input {
            display: none;
        }

        .upload-actions {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 0.8rem;
        }

        .btn {
            border: none;
            background: #ffffff;
            padding: 0.8rem 1.6rem;
            border-radius: 3rem;
            font-weight: 600;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid #ccdae9;
            color: #1e2b3c;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
        }

        .btn i {
            font-size: 1rem;
        }

        .btn-primary {
            background: #1e2b3c;
            border: 1px solid #1e2b3c;
            color: white;
            box-shadow: 0 10px 18px -8px #1e2b3c99;
        }

        .btn-primary:hover {
            background: #0f1a26;
            border-color: #0f1a26;
        }

        .btn-secondary:hover {
            background: #e3ecf9;
            border-color: #b0c5dd;
        }

        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        .file-preview {
            margin-top: 1.2rem;
            background: #ecf2fa;
            border-radius: 1.2rem;
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            font-size: 0.95rem;
            border: 1px solid #cbd9eb;
        }

        .file-preview i {
            color: #1e2b3c;
            font-size: 1.3rem;
        }

        .file-preview .file-name {
            font-weight: 600;
            word-break: break-all;
            color: #0d1b2a;
        }

        .file-preview .file-size {
            color: #4b5e77;
            font-size: 0.85rem;
            margin-left: auto;
            white-space: nowrap;
            background: #d4e0ef;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
        }

        /* Apk list */
        .list-section {
            margin-top: 0.5rem;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.3rem;
        }

        .list-header .section-label {
            margin-bottom: 0;
        }

        .badge {
            background: #1e2b3c;
            color: white;
            padding: 0.35rem 1.1rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .apk-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            max-height: 460px;
            overflow-y: auto;
            padding-right: 0.4rem;
        }

        .apk-list::-webkit-scrollbar {
            width: 6px;
        }

        .apk-list::-webkit-scrollbar-track {
            background: #d9e2ef;
            border-radius: 10px;
        }

        .apk-list::-webkit-scrollbar-thumb {
            background: #7d95b3;
            border-radius: 10px;
        }

        .apk-item {
            background: white;
            border-radius: 1.5rem;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 5px 12px -6px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2ebf6;
            transition: all 0.15s;
            flex-wrap: wrap;
        }

        .apk-item:hover {
            border-color: #b6cae2;
            box-shadow: 0 12px 22px -12px #1e2b3c40;
            transform: scale(1.005);
        }

        .apk-icon {
            background: #1e2b3c;
            color: white;
            width: 3rem;
            height: 3rem;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
            box-shadow: 0 6px 12px -6px #1e2b3c80;
        }

        .apk-info {
            flex: 1;
            min-width: 160px;
        }

        .apk-name {
            font-weight: 700;
            font-size: 1.05rem;
            color: #0d1b2a;
            word-break: break-word;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .apk-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.3rem;
            font-size: 0.8rem;
            color: #4b5e77;
            flex-wrap: wrap;
        }

        .apk-meta i {
            margin-right: 0.2rem;
            font-size: 0.7rem;
            color: #647b99;
        }

        .download-btn {
            background: #eaf1fb;
            border: 1px solid #b9cee8;
            padding: 0.6rem 1.2rem;
            border-radius: 3rem;
            font-weight: 600;
            color: #1e2b3c;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 0.9rem;
            white-space: nowrap;
            text-decoration: none;
            margin-left: auto;
        }

        .download-btn:hover {
            background: #1e2b3c;
            border-color: #1e2b3c;
            color: white;
        }

        .download-btn i {
            font-size: 0.9rem;
        }

        .empty-state {
            background: #ffffffb3;
            border-radius: 1.8rem;
            padding: 2.5rem 1.5rem;
            text-align: center;
            color: #4f6582;
            border: 2px dashed #c1d3e8;
            font-weight: 500;
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
            color: #a5bad4;
        }

        .toast-message {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2b3c;
            color: white;
            padding: 0.8rem 1.8rem;
            border-radius: 3rem;
            font-weight: 500;
            box-shadow: 0 18px 30px -8px #0b1a2b;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            font-size: 0.95rem;
        }

        .toast-message.show {
            opacity: 1;
        }

        .toast-message i {
            color: #a5d6ff;
        }

        .footer-note {
            text-align: center;
            margin-top: 1.8rem;
            color: #5f738b;
            font-size: 0.8rem;
        }

        @media (max-width: 550px) {
            .app-container {
                padding: 1.5rem;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .apk-item {
                padding: 0.9rem 1rem;
            }
            .download-btn {
                padding: 0.5rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="header-icon">
                <i class="fas fa-robot"></i>
            </div>
            <h1>
                APK Uploader
                <span>share & download</span>
            </h1>
        </div>

        <!-- Upload Section -->
        <div class="upload-section">
            <div class="section-label">
                <i class="fas fa-cloud-upload-alt"></i>
                Upload your APK
            </div>

            <!-- Drop zone / file selector -->
            <div class="drop-area" id="dropArea">
                <i class="fas fa-file-arrow-up"></i>
                <p>Drag & drop an .apk file here</p>
                <small>or click to browse from your device</small>
                <input type="file" id="fileInput" class="file-input" accept=".apk,application/vnd.android.package-archive">
            </div>

            <div class="upload-actions">
                <button class="btn btn-primary" id="uploadBtn" disabled>
                    <i class="fas fa-upload"></i> Upload APK
                </button>
                <button class="btn btn-secondary" id="clearBtn">
                    <i class="fas fa-eraser"></i> Clear
                </button>
            </div>

            <!-- File preview -->
            <div id="filePreview" class="file-preview" style="display: none;">
                <i class="fas fa-file-android"></i>
                <span class="file-name" id="previewFileName">—</span>
                <span class="file-size" id="previewFileSize"></span>
            </div>
        </div>

        <!-- APK List -->
        <div class="list-section">
            <div class="list-header">
                <div class="section-label">
                    <i class="fas fa-download"></i>
                    Available downloads
                </div>
                <div class="badge" id="apkCount">0 APKs</div>
            </div>

            <div id="apkListContainer" class="apk-list">
                <!-- dynamic items appear here -->
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-box-open"></i>
                    <p>No APKs uploaded yet</p>
                    <small style="display:block; margin-top:0.5rem;">Upload an .apk file to share it</small>
                </div>
            </div>
        </div>

        <div class="footer-note">
            <i class="fas fa-shield-alt"></i> files stored locally in your browser
        </div>
    </div>

    <!-- Toast message -->
    <div id="toast" class="toast-message">
        <i class="fas fa-check-circle"></i>
        <span id="toastText">APK uploaded!</span>
    </div>

    <script>
        (function(){
            // ---------- state ----------
            // Each apk item: { id, name, size, blob, url }
            let apkFiles = [];

            // DOM elements
            const dropArea = document.getElementById('dropArea');
            const fileInput = document.getElementById('fileInput');
            const uploadBtn = document.getElementById('uploadBtn');
            const clearBtn = document.getElementById('clearBtn');
            const filePreview = document.getElementById('filePreview');
            const previewFileName = document.getElementById('previewFileName');
            const previewFileSize = document.getElementById('previewFileSize');
            const apkListContainer = document.getElementById('apkListContainer');
            const emptyState = document.getElementById('emptyState');
            const apkCountSpan = document.getElementById('apkCount');
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');

            // currently selected file (for upload)
            let selectedFile = null;

            // ---------- helpers ----------
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
            }

            // Show toast message
            function showToast(message, isSuccess = true) {
                toastText.textContent = message;
                const icon = toast.querySelector('i');
                if (isSuccess) {
                    icon.className = 'fas fa-check-circle';
                    icon.style.color = '#a5d6ff';
                } else {
                    icon.className = 'fas fa-exclamation-circle';
                    icon.style.color = '#ffb3a5';
                }
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2500);
            }

            // Update the preview UI based on selectedFile
            function updatePreview() {
                if (selectedFile) {
                    filePreview.style.display = 'flex';
                    previewFileName.textContent = selectedFile.name;
                    previewFileSize.textContent = formatFileSize(selectedFile.size);
                    uploadBtn.disabled = false;
                } else {
                    filePreview.style.display = 'none';
                    previewFileName.textContent = '—';
                    previewFileSize.textContent = '';
                    uploadBtn.disabled = true;
                }
            }

            // Reset file input and selected file
            function resetFileSelection() {
                fileInput.value = '';
                selectedFile = null;
                updatePreview();
            }

            // Render the APK list from apkFiles array
            function renderApkList() {
                // update count
                const count = apkFiles.length;
                apkCountSpan.textContent = count + (count === 1 ? ' APK' : ' APKs');

                // clear container except possibly keep empty state? We'll rebuild.
                // Remove all children except the empty state? Better: rebuild dynamically.
                // We'll remove all children, then add empty state if needed.
                apkListContainer.innerHTML = '';

                if (apkFiles.length === 0) {
                    // show empty state
                    apkListContainer.appendChild(emptyState);
                    return;
                }

                // Sort: newest first (higher id = newer)
                const sorted = [...apkFiles].sort((a, b) => b.id - a.id);

                sorted.forEach(apk => {
                    const item = document.createElement('div');
                    item.className = 'apk-item';

                    // icon
                    const iconDiv = document.createElement('div');
                    iconDiv.className = 'apk-icon';
                    iconDiv.innerHTML = '<i class="fab fa-android"></i>';

                    // info
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'apk-info';

                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'apk-name';
                    nameDiv.innerHTML = `<i class="fas fa-file-android" style="color: #1e2b3c; font-size: 1rem;"></i> ${escapeHtml(apk.name)}`;

                    const metaDiv = document.createElement('div');
                    metaDiv.className = 'apk-meta';
                    metaDiv.innerHTML = `
                        <span><i class="fas fa-database"></i> ${formatFileSize(apk.size)}</span>
                        <span><i class="fas fa-calendar-alt"></i> ${new Date(apk.id).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    `;

                    infoDiv.appendChild(nameDiv);
                    infoDiv.appendChild(metaDiv);

                    // download button (anchor)
                    const downloadLink = document.createElement('a');
                    downloadLink.className = 'download-btn';
                    downloadLink.href = apk.url;
                    downloadLink.download = apk.name; // forces download with original name
                    downloadLink.innerHTML = '<i class="fas fa-download"></i> Download';

                    item.appendChild(iconDiv);
                    item.appendChild(infoDiv);
                    item.appendChild(downloadLink);

                    apkListContainer.appendChild(item);
                });
            }

            // simple escape for HTML (names)
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // Add a new APK to the list (with blob URL)
            function addApkFile(file) {
                // create object URL for the blob
                const url = URL.createObjectURL(file);
                const newApk = {
                    id: Date.now(),          // also used as timestamp
                    name: file.name,
                    size: file.size,
                    blob: file,              // keep reference if needed
                    url: url,
                };
                apkFiles.push(newApk);
                renderApkList();
                showToast(`"${file.name}" added to downloads`, true);
            }

            // Clear selected file (but keep apk list)
            function clearSelection() {
                resetFileSelection();
                showToast('Selection cleared', true);
            }

            // Upload (add) the selected file to the list
            function uploadSelectedFile() {
                if (!selectedFile) {
                    showToast('No file selected', false);
                    return;
                }

                // optional: validate extension .apk
                const ext = selectedFile.name.split('.').pop().toLowerCase();
                if (ext !== 'apk') {
                    showToast('Only .apk files are allowed', false);
                    return;
                }

                // add to list
                addApkFile(selectedFile);

                // reset file input & preview
                resetFileSelection();

                // re-render list (already done in addApkFile, but safe)
                // renderApkList();  // called inside addApkFile
            }

            // ---------- event listeners ----------

            // Drop area click -> open file dialog
            dropArea.addEventListener('click', () => {
                fileInput.click();
            });

            // File input change
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    // validate .apk
                    const ext = file.name.split('.').pop().toLowerCase();
                    if (ext !== 'apk') {
                        showToast('Please select an .apk file', false);
                        fileInput.value = '';
                        return;
                    }
                    selectedFile = file;
                    updatePreview();
                } else {
                    selectedFile = null;
                    updatePreview();
                }
            });

            // Drag & drop events
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                });
            });

            dropArea.addEventListener('dragenter', () => {
                dropArea.style.borderColor = '#1e2b3c';
                dropArea.style.background = '#eef4fe';
            });

            dropArea.addEventListener('dragleave', () => {
                dropArea.style.borderColor = '#9bb1ca';
                dropArea.style.background = '#f8fcff';
            });

            dropArea.addEventListener('drop', (e) => {
                dropArea.style.borderColor = '#9bb1ca';
                dropArea.style.background = '#f8fcff';

                const files = e.dataTransfer.files;
                if (files.length === 0) return;

                const file = files[0]; // only first file
                const ext = file.name.split('.').pop().toLowerCase();
                if (ext !== 'apk') {
                    showToast('Only .apk files are supported', false);
                    return;
                }

                // set as selected file
                selectedFile = file;
                // update file input value? cannot set directly, but we can store in memory and preview.
                // we also want to reflect in input (but file input is readonly for security)
                // we can just update preview and keep selectedFile.
                updatePreview();

                // also we can set fileInput.files? that's not possible directly, but we can use DataTransfer
                // (not necessary; we rely on selectedFile variable)
                // But to keep consistency, we can clear the fileInput:
                fileInput.value = '';
                // However, when user clicks upload, it uses selectedFile. Fine.
            });

            // Upload button
            uploadBtn.addEventListener('click', uploadSelectedFile);

            // Clear button
            clearBtn.addEventListener('click', clearSelection);

            // optional: if user clicks elsewhere, we don't clear selection, fine.

            // initial render
            renderApkList();
            updatePreview();

            // also prefill with a demo? not necessary. But we could add a demo if needed? no.

            // Handle window unload to revoke object URLs (good practice)
            window.addEventListener('beforeunload', () => {
                apkFiles.forEach(apk => {
                    if (apk.url) URL.revokeObjectURL(apk.url);
                });
            });

            // Since we want the "emptyState" to be reused, it's already in the container initially.
            // But when we do apkListContainer.innerHTML = '', we remove it and later append it again.
            // We need a reference to the original empty state element.
            // But we re-created? We stored it as const emptyState = document.getElementById('emptyState').
            // However, after innerHTML = '', that element is removed from DOM but still referenced.
            // Then we append it again – so it's fine. It's the same node, just moved.
            // We must make sure it's not duplicated. renderApkList will append it only when empty.

            // Extra: Override initial empty state render just to be safe
            // (already in the container, but call renderApkList to reflect count)
            // call again after setting up.
            // But renderApkList() uses emptyState variable that is still valid (even if already in DOM).
            // However, the initial container already contains emptyState and it might be duplicated?
            // Let's check: initially apkListContainer contains the emptyState div.
            // When we call renderApkList(), if apkFiles is empty, we do apkListContainer.innerHTML = '' which removes
            // all children including the empty state. Then we append emptyState again. So no duplicate.
            // It's fine.
            // Edge: if apkFiles not empty, emptyState is detached, but still referenced.
            // Good.
        })();
    </script>
</body>
</html>
