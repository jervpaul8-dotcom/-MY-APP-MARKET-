<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APK upload · simple app</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f7f9fc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }

    .app-card {
      background: #ffffff;
      max-width: 640px;
      width: 100%;
      border-radius: 2rem;
      box-shadow: 0 20px 35px -8px rgba(0, 20, 30, 0.2), 0 8px 16px -6px rgba(0, 0, 0, 0.05);
      padding: 2rem 2rem 2.5rem;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(2px);
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #0b1c2e;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.25rem;
    }

    h1 span {
      background: #eef3fe;
      border-radius: 100px;
      padding: 0.2rem 0.8rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: #1f5f9e;
      letter-spacing: 0.01em;
      border: 1px solid #d0e0ff;
    }

    .subhead {
      color: #4b5e71;
      margin-bottom: 2rem;
      font-size: 1rem;
      border-left: 4px solid #9bb9e0;
      padding-left: 1rem;
      background: #f3f8ff;
      border-radius: 0 12px 12px 0;
      padding: 0.8rem 1rem;
      margin-top: 0.4rem;
    }

    .drop-zone {
      border: 2px dashed #b7c9e0;
      background: #fafdff;
      border-radius: 1.8rem;
      padding: 2rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 2rem;
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      background: #ecf5ff;
      border-color: #3b82f6;
      transform: scale(1.005);
    }

    .drop-zone-icon {
      font-size: 3.2rem;
      line-height: 1;
      filter: drop-shadow(0 6px 8px rgba(0, 80, 200, 0.1));
    }

    .drop-zone-text {
      font-weight: 500;
      color: #1a344d;
    }

    .drop-zone-sub {
      font-size: 0.85rem;
      color: #667e99;
      margin-top: 0.2rem;
    }

    .file-input {
      display: none;
    }

    .browse-btn {
      background: white;
      border: 1.5px solid #cddef5;
      border-radius: 100px;
      padding: 0.5rem 1.5rem;
      font-weight: 500;
      color: #1d4c7c;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 0.5rem;
    }

    .browse-btn:hover {
      background: #e6f0ff;
      border-color: #6c9fd1;
    }

    .file-pill {
      background: #f0f6ff;
      border-radius: 60px;
      padding: 1rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.8rem;
      border: 1px solid #cfe0f5;
      box-shadow: 0 2px 6px rgba(0, 70, 150, 0.03);
      transition: 0.15s;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      overflow: hidden;
    }

    .file-icon {
      background: #ffffff;
      border-radius: 60px;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 4px 8px rgba(0, 50, 120, 0.08);
      flex-shrink: 0;
    }

    .file-details {
      overflow: hidden;
    }

    .file-name {
      font-weight: 600;
      color: #0e2740;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .file-size {
      font-size: 0.8rem;
      color: #597a9b;
      margin-top: 0.1rem;
    }

    .remove-btn {
      background: transparent;
      border: none;
      font-size: 1.6rem;
      line-height: 1;
      color: #8fa8c2;
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      border-radius: 30px;
      transition: all 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .remove-btn:hover {
      background: #ffe6e6;
      color: #c03535;
    }

    .upload-btn {
      background: #0b1c2e;
      color: white;
      border: none;
      width: 100%;
      padding: 1rem 1.8rem;
      border-radius: 60px;
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 8px 18px -6px rgba(10, 30, 60, 0.3);
      letter-spacing: 0.01em;
      border: 1px solid #1e3b5c;
    }

    .upload-btn:hover:not(:disabled) {
      background: #132d45;
      box-shadow: 0 12px 24px -8px rgba(0, 30, 70, 0.4);
      transform: translateY(-1px);
    }

    .upload-btn:disabled {
      background: #cbd8e6;
      border-color: #b5c6d9;
      color: #7b8fa5;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .upload-btn .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-message {
      margin-top: 1.6rem;
      padding: 1rem 1.4rem;
      border-radius: 1.2rem;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: #f4faff;
      border-left: 5px solid #3874c4;
      color: #1a3958;
    }

    .status-message.success {
      background: #eafff0;
      border-left-color: #1f9e5e;
      color: #0d4b2a;
    }

    .status-message.error {
      background: #fff3f3;
      border-left-color: #cf2e2e;
      color: #6b1a1a;
    }

    .status-icon {
      font-size: 1.4rem;
    }

    .hidden {
      display: none !important;
    }

    .footer-note {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #8f9fb1;
      text-align: center;
      border-top: 1px solid #e6ecf5;
      padding-top: 1.2rem;
    }

    .limit-badge {
      display: inline-block;
      background: #e8f0fe;
      border-radius: 60px;
      padding: 0.2rem 0.8rem;
      font-size: 0.75rem;
      color: #2b578b;
      margin-left: 0.5rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="app-card">
    <h1>
      📦 APK Upload
      <span>beta</span>
    </h1>
    <div class="subhead">
      Select or drop an .apk file — it will be validated and uploaded (simulated).
    </div>

    <!-- Drop zone -->
    <div class="drop-zone" id="dropZone">
      <div class="drop-zone-icon">📲</div>
      <div class="drop-zone-text">Drag & drop your APK here</div>
      <div class="drop-zone-sub">or</div>
      <button class="browse-btn" id="browseBtn" type="button">
        <span>📁</span> Browse files
      </button>
      <input type="file" id="fileInput" class="file-input" accept=".apk,application/vnd.android.package-archive">
    </div>

    <!-- Selected file card (hidden by default) -->
    <div id="fileCard" class="file-pill hidden">
      <div class="file-info">
        <div class="file-icon">🤖</div>
        <div class="file-details">
          <div class="file-name" id="fileName">example.apk</div>
          <div class="file-size" id="fileSize">2.4 MB</div>
        </div>
      </div>
      <button class="remove-btn" id="removeFileBtn" title="Remove file">✕</button>
    </div>

    <!-- Upload button -->
    <button class="upload-btn" id="uploadBtn" disabled>
      ⬆️ Upload APK
    </button>

    <!-- Status message area -->
    <div id="statusMessage" class="status-message hidden">
      <span class="status-icon" id="statusIcon">ℹ️</span>
      <span id="statusText">No file selected</span>
    </div>

    <div class="footer-note">
      ⚡ Max file size: 150 MB · Only .apk accepted
    </div>
  </div>

  <script>
    (function() {
      // --- DOM refs ---
      const dropZone = document.getElementById('dropZone');
      const fileInput = document.getElementById('fileInput');
      const browseBtn = document.getElementById('browseBtn');
      const fileCard = document.getElementById('fileCard');
      const fileNameEl = document.getElementById('fileName');
      const fileSizeEl = document.getElementById('fileSize');
      const removeFileBtn = document.getElementById('removeFileBtn');
      const uploadBtn = document.getElementById('uploadBtn');
      const statusMessage = document.getElementById('statusMessage');
      const statusIcon = document.getElementById('statusIcon');
      const statusText = document.getElementById('statusText');

      // --- State ---
      let selectedFile = null;
      let isUploading = false;

      // --- Utility: format file size ---
      function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
      }

      // --- Show status message (type: 'info', 'success', 'error') ---
      function setStatus(message, type = 'info') {
        statusMessage.classList.remove('hidden', 'success', 'error');
        if (type === 'success') {
          statusMessage.classList.add('success');
          statusIcon.textContent = '✅';
        } else if (type === 'error') {
          statusMessage.classList.add('error');
          statusIcon.textContent = '❌';
        } else {
          statusIcon.textContent = 'ℹ️';
        }
        statusText.textContent = message;
      }

      // --- Clear status (hide) ---
      function clearStatus() {
        statusMessage.classList.add('hidden');
        statusMessage.classList.remove('success', 'error');
        statusText.textContent = '';
      }

      // --- Reset file selection (UI + state) ---
      function resetFileSelection() {
        selectedFile = null;
        fileInput.value = '';        // clear native input
        fileCard.classList.add('hidden');
        uploadBtn.disabled = true;
        clearStatus();

        // Remove any drag-over highlight
        dropZone.classList.remove('drag-over');
      }

      // --- Update UI with selected file ---
      function setSelectedFile(file) {
        // Validate extension .apk
        const isApk = file.name.toLowerCase().endsWith('.apk');
        if (!isApk) {
          setStatus('Only .apk files are allowed.', 'error');
          resetFileSelection(); // clear invalid file
          return;
        }

        // Optional size limit (150 MB)
        const MAX_SIZE = 150 * 1024 * 1024; // 150MB
        if (file.size > MAX_SIZE) {
          setStatus(`File too large (max 150 MB). Selected: ${formatFileSize(file.size)}`, 'error');
          resetFileSelection();
          return;
        }

        // Valid file — store it
        selectedFile = file;

        // Update file card UI
        fileNameEl.textContent = file.name;
        fileSizeEl.textContent = formatFileSize(file.size);
        fileCard.classList.remove('hidden');
        uploadBtn.disabled = false;
        clearStatus();  // remove previous status
        setStatus(`Ready to upload: ${file.name}`, 'info');
      }

      // --- Handle file input change (browse) ---
      fileInput.addEventListener('change', (e) => {
        if (isUploading) return;
        const files = e.target.files;
        if (!files || files.length === 0) {
          // if user cancels, but we keep previous selection? But change didn't produce file.
          // We do not reset if there was a previous selected file? Actually if they cancel, no new file selected.
          // But the input might have been cleared? Better: if no files, we do nothing (preserve previous file)
          // However, to sync UI we need to check if input value is empty; if so, but previous selectedFile exists, we want to keep it.
          // We'll just return.
          return;
        }

        // Only take the first file
        const file = files[0];
        // if it's not apk, setSelectedFile will handle error and reset.
        // But if invalid, resetFileSelection clears input and selectedFile.
        setSelectedFile(file);
        // Note: if invalid, input.value gets cleared in resetFileSelection.
      });

      // --- Browse button triggers file input click ---
      browseBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (isUploading) return;
        fileInput.click();
      });

      // --- Drag & drop handling ---
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
        });
      });

      dropZone.addEventListener('dragenter', () => {
        if (isUploading) return;
        dropZone.classList.add('drag-over');
      });

      dropZone.addEventListener('dragover', () => {
        if (isUploading) return;
        dropZone.classList.add('drag-over');
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('drag-over');
      });

      dropZone.addEventListener('drop', (e) => {
        dropZone.classList.remove('drag-over');
        if (isUploading) return;

        const dt = e.dataTransfer;
        if (!dt) return;

        const files = dt.files;
        if (files.length === 0) return;

        const file = files[0];
        // if it's not apk, setSelectedFile will handle error and reset
        setSelectedFile(file);

        // Also reset fileInput value so that if they click browse later, it doesn't show old file
        fileInput.value = '';
      });

      // --- Remove file button ---
      removeFileBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (isUploading) return;
        resetFileSelection();
        setStatus('File removed.', 'info');
      });

      // --- Simulate upload process ---
      function simulateUpload() {
        return new Promise((resolve) => {
          setTimeout(() => {
            resolve({ success: true });
          }, 1800);
        });
      }

      // --- Upload button click ---
      uploadBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        if (isUploading) return;
        if (!selectedFile) {
          setStatus('No file selected.', 'error');
          return;
        }

        // Double-check extension again (redundant but safe)
        if (!selectedFile.name.toLowerCase().endsWith('.apk')) {
          setStatus('Only .apk files can be uploaded.', 'error');
          resetFileSelection();
          return;
        }

        // Start upload simulation
        isUploading = true;
        uploadBtn.disabled = true;
        // Change button appearance and show spinner
        uploadBtn.innerHTML = '<span class="spinner"></span> Uploading...';
        clearStatus();
        setStatus(`Uploading ${selectedFile.name} ...`, 'info');

        try {
          // Simulate async upload
          await simulateUpload();

          // On success
          setStatus(`✅ APK "${selectedFile.name}" uploaded successfully (simulated).`, 'success');
          // Keep file info? It's okay to keep, but maybe we clear after success? 
          // Better to keep but disable upload again? Let's reset file state after a moment.
          // But we want user to see success. We'll reset file selection but leave status.
          // However, resetFileSelection clears status too — we'll do manual clearing.
          selectedFile = null;
          fileInput.value = '';
          fileCard.classList.add('hidden');
          uploadBtn.disabled = true;   // stays disabled since no file
          // Keep the success message (do not clear)
        } catch (error) {
          setStatus('Upload failed. Please try again.', 'error');
          // Re-enable upload button if there's still a selected file? 
          // But selectedFile still exists? We didn't clear it on error.
          uploadBtn.disabled = false;
        } finally {
          isUploading = false;
          // Restore button content
          uploadBtn.innerHTML = '⬆️ Upload APK';
          // If selectedFile is null (success case), button disabled stays true.
          // If selectedFile is still present (error case), we want to enable button.
          if (selectedFile) {
            uploadBtn.disabled = false;
          } else {
            uploadBtn.disabled = true;
          }
        }
      });

      // --- Initial status: no file, button disabled ---
      uploadBtn.disabled = true;
      clearStatus();
      setStatus('No file selected. Drop or browse an APK.', 'info');

      // Prevent default drag/drop on window (so browser doesn't open file)
      window.addEventListener('dragover', (e) => e.preventDefault());
      window.addEventListener('drop', (e) => e.preventDefault());

      // Minor: if user clicks drop zone (not on browse button), open file dialog? 
      // Good UX: click on drop zone triggers file input.
      dropZone.addEventListener('click', (e) => {
        // If the click target is the browse button or inside it, let the button handle it.
        if (browseBtn.contains(e.target)) {
          return; // browse button already handles
        }
        // Avoid triggering when clicking on the hidden file input (it's invisible)
        if (e.target === fileInput) return;
        if (isUploading) return;
        fileInput.click();
      });

    })();
  </script>
</body>
</html>
